version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: simal-postgres-dev
    environment:
      POSTGRES_DB: simal_corporate_dev
      POSTGRES_USER: simal_app
      POSTGRES_PASSWORD: simal_dev_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simal_app -d simal_corporate_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: simal-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: simal_minio_admin
      MINIO_ROOT_PASSWORD: simal_minio_password_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:
