# portal-staging.conf — T2.1: NGINX edge for the portal (kyc.simalme.com) and the public
# site (simalme.com). TLS 1.3 only · HSTS · zoned rate limits. Vhost include: needs
# snippets/simal-proxy.conf at /etc/nginx/snippets/ and the SSG docroot (DEPLOY_DIR) at
# /var/www/simalme/dist.
#
# deploy-audit fixes:
#  - client_max_body_size: nginx's 1 MB default refused every KYC scan / CV / e-invoice
#    attachment over ~0.75 MB before it reached the portal (routes accept up to 26 MB).
#  - proxy headers come from snippets/simal-proxy.conf (proxy_params is Debian-only).
#  - the public vhost proxies ONLY the four endpoints the site calls; /api/admin, /api/cms
#    and /api/auth are no longer reachable on simalme.com.
#  - unknown site paths return the site's 404 page with status 404 (was the home page, 200).
#  - the portal's security headers (incl. CSP) are set by the app on every response; nginx
#    adding a second CSP made the browser enforce both, and its connect-src 'self' blocked
#    the CMS console's public-site probe.

limit_req_zone $binary_remote_addr zone=public_zone:10m rate=120r/m;   # public 120 req/min/IP
limit_req_zone $binary_remote_addr zone=login_zone:10m  rate=2r/m;     # rm(9.4-1): true semantics of rate=2r/m burst=10 nodelay = 11 requests
                                                                       # immediately, then 1 every 30 s per IP (NOT "10 per 5 min")
limit_req_zone $binary_remote_addr zone=status_zone:10m  rate=20r/m;   # status 20 req/min

upstream simal_portal {
    server portal:8090;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name kyc.simalme.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;     # managed by certbot/ops
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 27m;   # e-invoice routes accept 26 MB, KYC documents 14 MB per request
    server_tokens off;

    location /api/auth/login {
        limit_req zone=login_zone burst=10 nodelay;   # rm(9.4-1): 11 immediate, then 1/30s per IP; edge enforcement point
        limit_req_status 429;                         # rm(9.4-2): uniform with the app's 429s (503 is a server-error code)
        proxy_pass http://simal_portal;
        include /etc/nginx/snippets/simal-proxy.conf;
    }
    location /api/public/applications/ {
        limit_req zone=status_zone burst=5;
        limit_req_status 429;
        proxy_pass http://simal_portal;
        include /etc/nginx/snippets/simal-proxy.conf;
    }
    location / {
        limit_req zone=public_zone burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://simal_portal;
        include /etc/nginx/snippets/simal-proxy.conf;
    }
}

server {
    listen 80;
    server_name kyc.simalme.com;
    return 301 https://$host$request_uri;
}

# Public site (SSG) vhost with the site's own /api/ calls proxied to the portal (P3-1 / PUB-2)
server {
    listen 443 ssl;
    http2 on;
    server_name simalme.com www.simalme.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/simalme/dist;   # = the portal's DEPLOY_DIR (the SSG worker publishes here)
    index index.html;
    client_max_body_size 9m;      # careers CV upload: the route accepts 8 MB
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://kyc.simalme.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # the only portal endpoints the public site calls (RFQ basket + submit, contact, careers)
    location ~ ^/api/(rfq-basket|rfq|contact|careers/apply)(/|$) {
        limit_req zone=public_zone burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://simal_portal;
        include /etc/nginx/snippets/simal-proxy.conf;
    }
    location /api/ { return 404; }

    # Static SSG output. Astro's /_astro/ bundles are content-hashed; /assets/ files are
    # cache-busted with ?v=; HTML must revalidate so a publish is visible at once.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /assets/ {
        expires 1d;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ /\. { deny all; }
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;
}

server {
    listen 80;
    server_name simalme.com www.simalme.com;
    return 301 https://$host$request_uri;
}
