# simal-proxy.conf — proxy headers for the portal upstream. Replaces Debian's
# /etc/nginx/proxy_params, which the official nginx image does not ship (nginx refused to
# start: "open() /etc/nginx/proxy_params failed"). Install at /etc/nginx/snippets/.
#
# X-Forwarded-For is APPENDED ($proxy_add_x_forwarded_for): the portal reads it from the
# right and honours it only from TRUSTED_PROXIES (deploy-audit H2), so set TRUSTED_PROXIES
# to this nginx's address as the portal sees it.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";
proxy_connect_timeout 10s;
proxy_read_timeout    60s;
