# portal-rig.conf — rm(9.4-2)/NFR-4: rig rehearsal of the staging edge limits.
# Same limit_req zones and semantics as portal-staging.conf, adapted for the dev
# rig: a COMPLETE main config (events/http — the staging file is a vhost include),
# plain HTTP on 127.0.0.1:8443 (no certbot), the portal at 127.0.0.1:8090, and
# proxy_params inlined. Run from Codebase/:
#   tools/nginx/nginx.exe -p tools/nginx -c ../../infra/nginx/portal-rig.conf
#   tools/nginx/nginx.exe -p tools/nginx -c ../../infra/nginx/portal-rig.conf -s stop
# Then scripts/ci/rate-limit-probe.mjs produces the edge-vs-app transcript.

worker_processes 1;
error_log logs/rig-error.log notice;

events { worker_connections 128; }

http {
    access_log logs/rig-access.log;

    limit_req_zone $binary_remote_addr zone=public_zone:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=login_zone:10m  rate=2r/m;   # 11 immediate, then 1/30s per IP
    limit_req_zone $binary_remote_addr zone=status_zone:10m  rate=20r/m;

    server {
        listen 127.0.0.1:8443;
        server_name _;

        location /api/auth/login {
            limit_req zone=login_zone burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/public/applications/ {
            limit_req zone=status_zone burst=5;
            proxy_pass http://127.0.0.1:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/ {
            limit_req zone=public_zone burst=30 nodelay;
            proxy_pass http://127.0.0.1:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # SPA + static — same limits as the staging public zone
        location / {
            limit_req zone=public_zone burst=30 nodelay;
            proxy_pass http://127.0.0.1:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
