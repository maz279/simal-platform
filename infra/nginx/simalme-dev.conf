# simalme-dev.conf — P0-2 (remediation plan 2026-10-12)
# Public-site vhost for staging/dev nginx: serves the SSG dist and
# reverse-proxies /api/* to the portal, closing the topology gap of PUB-2
# (the site calls relative /api/*; portal-staging.conf fronts only
# kyc.simalme.com). scripts/dev-edge.mjs is the dependency-free equivalent
# used by `node scripts/bringup.mjs` on hosts without nginx.
#
# Dev/staging only: HTTP, no TLS termination — production adds the same
# TLS/header block as infra/nginx/portal-staging.conf.

server {
    listen 8100;
    server_name simalme.local 127.0.0.1;

    root /srv/simal/site/dist;   # mount apps/site/dist here in staging
    index index.html;

    # --- the missing production route: site origin -> portal API ---
    location /api/ {
        proxy_pass http://portal:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static SSG output: never execute, never list, deny dotfiles.
    location / {
        try_files $uri $uri/index.html =404;
    }
    location ~ /\. { deny all; }
    location ~* \.(html)$ { add_header Cache-Control "no-cache"; }
    location ~* \.(png|jpg|jpeg|webp|avif|svg|woff2|css|js)$ { add_header Cache-Control "public, max-age=86400"; }
}
