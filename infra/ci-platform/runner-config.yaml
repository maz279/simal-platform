# gitea-runner config for the rig CI platform (rm 9.1-3). Keys: `gitea-runner config generate`.
log:
  level: info

runner:
  file: .runner
  # One job at a time: jobs run on the host network (below), so two concurrent
  # jobs would both start their postgres:16 service on port 5432.
  capacity: 1
  timeout: 2h
  # runs-on labels used by ci.yml. ghcr.io (not Docker Hub) keeps pulls anonymous.
  labels:
    - "ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-24.04"
    - "ubuntu-24.04:docker://ghcr.io/catthehacker/ubuntu:act-24.04"
  # Safe with capacity 1: setup-node's Node 22 is downloaded once, not per job.
  tool_cache_mode: shared

cache:
  enabled: true

container:
  # ci.yml targets GitHub-hosted VMs, where a job reaches its service containers
  # on localhost (DATABASE_URL=...@localhost:5432). Host networking gives the job
  # container and its services one network namespace, so the workflow runs as written.
  network: host
  force_pull: false
