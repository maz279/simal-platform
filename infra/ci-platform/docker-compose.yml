# infra/ci-platform — rm(9.1-3): self-hosted CI platform for the rig.
#
# Gitea (git host + Actions) and one act_runner executing .github/workflows/ci.yml
# unchanged. Gitea listens on 127.0.0.1 only (never exposed on the LAN).
# Bring-up, credentials and the swap to the company host: see README.md here.
#
#   docker compose -f infra/ci-platform/docker-compose.yml --env-file data/ci-platform/runner.env up -d
name: simal-ci

services:
  gitea:
    # gitea 28.1.0, pinned by digest
    image: docker.gitea.com/gitea@sha256:f505a0d3a41323b786e05942fc7a4075e07ae7c169fd9485649aa55ee543a21a
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: localhost
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__server__OFFLINE_MODE: "true"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__actions__ENABLED: "true"
      GITEA__actions__DEFAULT_ACTIONS_URL: github
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - gitea-data:/data

  runner:
    # gitea-runner v5.1.1 (formerly act_runner), pinned by digest
    image: docker.gitea.com/act_runner@sha256:2966f97fd3897a62f5f92e91255b0a886039051eff6f058b2292f10e28137ea1
    restart: unless-stopped
    depends_on: [gitea]
    environment:
      CONFIG_FILE: /config.yaml
      # Jobs inherit this URL for actions/checkout and run on the host network
      # (runner-config.yaml), where the compose service name `gitea` does not
      # resolve. host.docker.internal reaches the published port from both sides.
      GITEA_INSTANCE_URL: http://host.docker.internal:3000
      GITEA_RUNNER_NAME: simal-rig-runner
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN:?run bootstrap.mjs first}
    volumes:
      - ./runner-config.yaml:/config.yaml:ro
      - runner-data:/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  gitea-data:
  runner-data:
