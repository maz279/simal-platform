<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>e-Invoice Console — Simal Staff</title>
<link rel="stylesheet" href="assets/css/base.css">
<style>
body{background:var(--gray-50)}
.topbar{background:var(--brand-900);color:#fff;padding:14px 0}
.topbar .in{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.topbar b{font-size:15px}
.topbar .who{margin-left:auto;font-size:13px;color:rgba(255,255,255,.75)}
.topbar a{color:#fff;font-size:13px}
.wrap{max-width:1280px;margin:0 auto;padding:26px 20px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .n{font-size:24px;font-weight:800;color:var(--brand-700)}
.stat .l{font-size:11.5px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:inherit;font-weight:600;font-size:13px}
.chip.on{background:var(--brand-700);color:#fff;border-color:var(--brand-700)}
table.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th{background:var(--gray-100);text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:10px 14px;color:var(--ink-3)}
.tbl td{padding:11px 14px;border-top:1px solid var(--line);font-size:13.5px}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px}
.st-draft{background:#EEF1F5;color:#3D4A5C}.st-submitted{background:#FFF4E0;color:#8A5A00}
.st-validated{background:#E3F0FF;color:#0F4C9C}.st-delivered{background:#E2F5EC;color:#0E5A47}
.st-rejected{background:#FDECEC;color:#8C2F2A}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin-top:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn{border:none;border-radius:10px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer}
.btn-p{background:var(--brand-700);color:#fff}.btn-o{background:#fff;border:1.5px solid var(--line);color:var(--ink-2)}
.btn-d{background:#0E5A47;color:#fff}.btn-r{background:#B3261E;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 0}
.chk .ok{color:#0E5A47;font-weight:800}.chk .no{color:#B3261E;font-weight:800}
.tl{list-style:none;padding:0;margin:0}
.tl li{padding:8px 0 8px 18px;border-left:2px solid var(--line);position:relative;font-size:13px}
.tl li:before{content:'';position:absolute;left:-6px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--brand-700)}
pre.ubl{background:var(--gray-900);color:#CFE3D8;padding:16px;border-radius:12px;overflow:auto;font-size:12px;max-height:360px}
.mono{font-family:var(--font-mono,monospace)}
textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 13px;font:inherit;min-height:70px}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar"><div class="in">
  <b>Simal — Staff Console</b>
  <span>e-Invoice validation &amp; delivery (Peppol Phase 1)</span>
  <span class="who" id="who"></span>
  <a href="admin.html">KYC queue</a>
  <a href="#" id="out">Sign out</a>
</div></div>
<div class="wrap">
  <div class="cards" id="stats"></div>
  <div class="chips" id="filters"></div>
  <table class="tbl"><thead><tr>
    <th>Reference</th><th>Buyer</th><th>TRN</th><th>Partner</th><th>Issue</th>
    <th style="text-align:right">Total (AED)</th><th>KYC</th><th>Status</th><th>Age</th><th></th>
  </tr></thead><tbody id="rows"></tbody></table>
  <div class="panel" id="detail" hidden></div>
</div>
<script src="assets/js/api.js?v=6"></script>
<script src="assets/js/invoices-admin.js"></script>
</body>
</html>
